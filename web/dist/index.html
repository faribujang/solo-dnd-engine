<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>Cinderhold</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ─────────────────────────────────────────────────── tokens
   Ember on soot. The neutral is warm — a grey biased toward the forge accent, so
   nothing on screen reads as default browser chrome. */
:root {
  --ground:#14110f; --surface:#1c1815; --raised:#241e1a; --line:#332b25;
  --ink:#ece4d8; --muted:#9d8f83; --faint:#6d625a;
  --ember:#d4703a; --brass:#c9a227; --blood:#b04434; --moss:#6f8f5f;
  --prose:#e6dccd;
  --r:10px; --pad:16px;
  --ui:"IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --serif:"EB Garamond", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--ui); font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%; overscroll-behavior-y:none;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hide{display:none !important}

/* ── the landing screen */
#home{
  position:fixed;inset:0;z-index:40;overflow-y:auto;
  background:
    radial-gradient(120% 90% at 50% -10%, #2a1d14 0%, transparent 60%),
    var(--ground);
  display:grid;place-items:center;padding:28px 18px calc(env(safe-area-inset-bottom) + 28px);
}
#home[hidden]{display:none}
.homecard{width:100%;max-width:440px}
#home h1{
  font-family:var(--serif);font-size:clamp(38px,11vw,58px);font-weight:600;
  margin:0 0 10px;letter-spacing:.01em;line-height:1;
  background:linear-gradient(180deg,var(--ink),var(--ember));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
#home .tagline{
  font-family:var(--serif);font-size:16.5px;line-height:1.55;color:var(--muted);
  margin:0 0 26px;text-wrap:balance;
}
#home .homefoot{font-size:11.5px;color:var(--faint);margin:20px 0 0;letter-spacing:.03em}
.homebtn{
  display:block;width:100%;text-align:left;border:1px solid var(--line);
  border-radius:var(--r);background:var(--surface);padding:14px 15px;margin-bottom:9px;
}
.homebtn:active{background:var(--raised)}
.homebtn.primary{border-color:var(--ember);background:#241a12}
.homebtn .t{font-family:var(--serif);font-size:18px}
.homebtn.primary .t{color:var(--ember)}
.homebtn .d{font-size:12.5px;color:var(--muted);margin-top:3px}

/* ─────────────────────────────────────────────────── shell */
/* ── the shell.
   Phone: one column, panels as bottom sheets. Desk: three, because there is room and
   because a map you have to open is a map you do not look at. Same HTML, same builders,
   same click handling — only where it is mounted changes. */
#app{display:flex;flex-direction:column;height:100dvh;max-width:720px;margin:0 auto;position:relative}
.side{display:none}
/* True at every width, and stated once. The media queries below only decide how wide it
   is — never whether it is a column, because that is what makes the feed scroll. */
#center{display:flex;flex-direction:column;min-width:0;min-height:0;height:100dvh}

/*
 * Columns by FLEX, not grid, and not through custom properties.
 *
 * This was `grid-template-columns: var(--lw) minmax(0,1fr) var(--rw)`. When a var() in a
 * track list fails to resolve, the whole declaration is invalid at computed-value time and
 * the grid falls back to ONE implicit column — so the three panels stacked vertically at
 * content width and the map went full-bleed across the top. A layout with one hard
 * dependency that can silently delete it is not worth the elegance.
 *
 * `#app` is already a flex column on a phone; a desk only turns it sideways. Hiding a
 * panel is `display:none`, which flex absorbs with no track list to keep in step.
 */
@media (min-width:1100px){
  #app{max-width:none;flex-direction:row;overflow:hidden}
  .side{
    display:flex;flex-direction:column;min-width:0;background:var(--surface);
    border-right:1px solid var(--line);overflow:hidden;
  }
  .side.left{flex:0 0 320px}
  .side.right{flex:0 0 400px;border-right:0;border-left:1px solid var(--line)}
  #app.no-left .side.left{display:none}
  #app.no-right .side.right{display:none}
  /* The centre takes what is left and is allowed to be narrower than its content. */
  #center{flex:1 1 0}
  .panel{flex:1 1 0;min-height:0;overflow-y:auto;padding:12px 14px}
  .panel + .panel{border-top:1px solid var(--line)}
  .panel h2{font-family:var(--serif);font-size:17px;margin:0 0 8px;font-weight:600}
  .panel h3{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin:14px 0 6px;font-weight:600}
  .side.right .panel{padding:0}
}


/* ── scene header: where you are, when, who is here. Sticky because it is the
      one thing you re-read constantly on a phone. */
header{
  flex:0 0 auto; background:var(--surface); border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 10px;
}
.hrow{display:flex;align-items:baseline;gap:10px}
.place{font-family:var(--serif);font-size:21px;font-weight:600;letter-spacing:.01em;flex:1;min-width:0;
  text-wrap:balance;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.when{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.gear{
  flex:0 0 auto;width:28px;height:28px;border-radius:8px;border:1px solid var(--line);
  background:var(--raised);color:var(--muted);font-size:13px;display:grid;place-items:center;
}
.gear.on{color:var(--ember);border-color:#4a3a2c}
#toggleLeft,#toggleRight{display:none}
@media (min-width:1100px){ #toggleLeft,#toggleRight{display:grid} }
.hmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;align-items:center}
.tag{
  font-size:11.5px;padding:2.5px 8px;border-radius:999px;
  border:1px solid var(--line);background:var(--raised);color:var(--muted);
  white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;
}
.tag.person{border-color:#4a3a2c;color:#d8c3a8}
.tag.hostile{border-color:#5a2f27;color:#e0a196}
.tag.hp{border-color:#3a4a30;color:#bcd4ac;font-family:var(--mono)}

/* ── the combat banner. Not a panel behind a tab: a player who does not know a fight is
      happening reads every combat-only refusal as the game being broken. */
.fight{
  margin-top:9px;border:1px solid #5a3a20;border-radius:var(--r);
  background:#241a12;padding:9px 11px;
}
.fight .fhead{
  display:flex;justify-content:space-between;gap:8px;align-items:baseline;
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ember);font-weight:600;
}
.fight .pips{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:0}
.fight .pips b{color:var(--brass);font-weight:500}
.fight .pips s{color:var(--faint);text-decoration:line-through}
.combatant{display:flex;gap:8px;align-items:baseline;margin-top:7px;font-size:13px}
.combatant .nm{flex:0 0 auto;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.combatant.now .nm{color:var(--ember);font-weight:600}
.combatant.enemy .nm{color:#e0a196}
.combatant .hpn{font-family:var(--mono);font-size:11.5px;color:var(--muted);flex:0 0 auto}
.combatant .it{flex:1;min-width:0;font-size:12px;color:var(--faint);font-style:italic;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.combatant.gone{opacity:.45}
.fight .fobj{
  margin-top:6px;font-size:12.5px;color:var(--brass);
  border-top:1px solid #3d2a18;padding-top:6px;
}
.fight .fground{margin-top:4px;font-size:12px;color:var(--faint);font-style:italic}
.tag.hurt{border-color:#5a2f27;color:#e0a196}

/* ── the feed */
/* `min-height:0` is load-bearing: without it a flex child refuses to shrink below its
   content, so the feed grows instead of scrolling and pushes the composer off-screen. */
main{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:18px var(--pad) 8px;-webkit-overflow-scrolling:touch}
.entry{margin:0 0 20px}
.said{
  font-size:14px;color:var(--ember);border-left:2px solid var(--ember);
  padding-left:11px;margin-bottom:14px;
}
.said::before{content:"› ";opacity:.6}
.narr{font-family:var(--serif);font-size:var(--prose-size,18.5px);line-height:1.62;color:var(--prose);white-space:pre-wrap}
.narr em,.narr i{color:#f0e2cb}
.sys{font-size:13px;color:var(--faint);font-style:italic}
.err{font-size:13.5px;color:#e0a196;background:#2a1a16;border:1px solid #5a2f27;border-radius:var(--r);padding:10px 12px}

/* ── the roll card. The mechanics land before the prose, so this is the thing you
      actually look at first — it gets the tabular figures and the outcome stripe. */
.roll{
  border:1px solid var(--line);border-left:3px solid var(--faint);border-radius:var(--r);
  background:var(--raised);padding:10px 12px;margin:0 0 12px;font-family:var(--mono);font-size:13px;
}
.roll.good{border-left-color:var(--moss)} .roll.bad{border-left-color:var(--blood)}
.roll.crit{border-left-color:var(--brass)}
.rtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.rpurpose{color:var(--muted);font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-family:var(--ui)}
.routcome{font-weight:500;letter-spacing:.05em;font-size:12px}
.good .routcome{color:var(--moss)} .bad .routcome{color:var(--blood)} .crit .routcome{color:var(--brass)}
.rmath{margin-top:5px;font-variant-numeric:tabular-nums;color:var(--ink)}
.rmath .nat{color:var(--brass);font-weight:500}
.rmath .dim{color:var(--faint)}
.summary{font-size:13.5px;color:var(--muted);margin:0 0 10px}

/* ── the receipt. What the turn actually moved, under the prose. A turn that moved
      nothing prints nothing, and a run of those is the game telling you it is circling. */
.changed{margin-top:11px;display:flex;flex-direction:column;gap:4px}
.ch{
  display:flex;gap:7px;align-items:baseline;font-size:12.5px;color:var(--muted);
  padding-left:10px;border-left:2px solid var(--line);
}
.ch .g{flex:0 0 auto;width:14px;text-align:center;font-size:11px}
.ch.up{border-left-color:var(--moss)}
.ch.down{border-left-color:var(--blood)}
.ch.big{border-left-color:var(--brass);color:var(--ink)}
.ch b{color:var(--ink);font-weight:500}

/* ── composer */
footer{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);padding:8px var(--pad) calc(env(safe-area-inset-bottom) + 8px)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;font-size:13.5px;padding:7px 13px;border-radius:999px;
  border:1px solid var(--line);background:var(--raised);color:var(--ink);
  max-width:78vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.chip:active{background:var(--line)}
.chip .m{
  color:var(--brass);font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  margin-right:5px;font-weight:600;
}
.bar{display:flex;gap:8px;align-items:flex-end}
.icon{
  flex:0 0 auto;width:42px;height:42px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--raised);display:grid;place-items:center;font-size:17px;
}
textarea#say{
  flex:1 1 auto;min-width:0;resize:none;background:var(--raised);border:1px solid var(--line);
  border-radius:var(--r);padding:11px 12px;font-size:16px;line-height:1.35;max-height:120px;
  font-family:var(--serif);
}
textarea#say::placeholder{color:var(--faint);font-family:var(--ui);font-size:14px}
#send{
  flex:0 0 auto;width:42px;height:42px;border-radius:var(--r);
  background:var(--ember);color:#180f08;font-size:18px;display:grid;place-items:center;font-weight:600;
}
#send[disabled],.icon[disabled]{opacity:.4}
.working{font-size:12px;color:var(--faint);padding:0 0 6px;letter-spacing:.04em}
.working b{color:var(--ember);font-weight:500}

/* ── the tab bar. Two unlabelled icons in opposite corners is not a menu; nobody finds
      the map that way. Five named targets, always visible, is the whole fix. */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:2px 0 8px}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--raised);
  font-size:10px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;
}
.tab .g{font-size:16px;line-height:1}
.tab[disabled]{opacity:.4}
.tab.dot{position:relative}
.tab.dot::after{
  content:"";position:absolute;top:5px;right:8px;width:5px;height:5px;
  border-radius:50%;background:var(--ember);
}

/* ── the map. A grid of known places, not a rendered world: this is a text game and the
      map's job is to answer "where can I go and how far", not to look like terrain. */
/* ── the map. Drag to pan, wheel or pinch to zoom. The viewport clips; the plane
      inside it is transformed. Nothing re-lays-out while you drag. */
.mapwrap{position:relative;overflow:hidden;touch-action:none;background:#11100e;
  border:1px solid var(--line);border-radius:var(--r);cursor:grab;
  /* An absolutely-positioned plane gives its parent no height, so the parent states one. */
  height:52dvh;min-height:240px}
.mapwrap.dragging{cursor:grabbing}
.side.right .mapwrap{border:0;border-radius:0;height:100%}
.mapplane{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.maptools{
  position:absolute;right:8px;bottom:8px;display:flex;gap:6px;z-index:2;
}
.maptools button{
  width:30px;height:30px;border:1px solid var(--line);border-radius:8px;
  background:#1c1815cc;color:var(--muted);font-size:15px;line-height:1;
  display:grid;place-items:center;backdrop-filter:blur(3px);
}
.maphint{
  position:absolute;left:10px;bottom:10px;z-index:2;font-size:11px;color:var(--faint);
  pointer-events:none;
}
.mapgrid{position:relative;min-width:100%;height:var(--mh);}
.mnode{
  position:relative;white-space:nowrap;
  font-size:11.5px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);
  background:var(--raised);color:var(--muted);
}
.mnodewrap{position:absolute;transform:translate(-50%,-50%);text-align:center}
.mppl{display:block;margin-top:3px;font-size:9px;color:var(--moss);letter-spacing:1px;cursor:default}
.youdot{
  display:inline-block;width:7px;height:7px;border-radius:50%;background:#7ee08a;
  margin-right:5px;box-shadow:0 0 0 2px #7ee08a33;vertical-align:middle;
}
.mnode.town{font-weight:600;border-color:#5a4632}
.crumbs{display:flex;gap:8px;align-items:center;margin:0 0 8px}
.crumb{
  font-size:12px;color:var(--muted);border:1px solid var(--line);
  border-radius:999px;padding:4px 10px;background:var(--raised);
}
.crumbnow{font-size:12px;color:var(--ember);letter-spacing:.04em}
.side.right .crumbs{padding:10px 12px 0;margin:0}
.side.right h2{padding:12px 12px 0}
.side.right .mlegend{padding:0 12px 12px}
.mnode.seen{color:var(--ink);border-color:#4a3a2c}
.mnode.found{color:var(--muted);border-color:#3d3128}
.mnode.here{background:var(--ember);color:#180f08;border-color:var(--ember);font-weight:600}
.mnode.unknown{opacity:.45;font-style:italic}
.mnode .mm{font-family:var(--mono);font-size:10px;opacity:.75;margin-left:5px}
.mlegend{font-size:11.5px;color:var(--faint);margin-top:10px;line-height:1.6}

/* ── journal + log rows */
.lead.now{border-left-color:var(--ember)}
.lead{
  display:block;width:100%;text-align:left;border:0;border-left:2px solid var(--ember);
  background:none;padding:3px 0 3px 11px;margin:6px 0;
  font-family:var(--serif);font-size:15px;line-height:1.45;color:var(--prose);
}
.turnrow{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.turnrow:last-child{border-bottom:0}
.turnrow .n{font-family:var(--mono);color:var(--faint);flex:0 0 30px;text-align:right}
.turnrow .s{flex:1;min-width:0}
.turnrow .c{font-size:12px;color:var(--faint);font-style:italic;margin-top:2px}
.turnrow .rb{
  flex:0 0 auto;align-self:center;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--line);border-radius:999px;padding:4px 9px;color:var(--muted);
}
.turnrow .rb:active{border-color:var(--blood);color:var(--blood)}
.warn{
  border:1px solid #5a3a20;background:#241a12;border-radius:var(--r);
  padding:11px 12px;margin:10px 0;font-size:13px;color:var(--ink);
}
.warn b{color:var(--ember)}
.sealed{font-size:12px;color:var(--faint);font-style:italic;margin-top:3px}
.topicbtn{width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--r);
  background:var(--raised);padding:9px 11px;margin-bottom:6px}
.topicbtn[disabled]{opacity:.5}
.topicbtn .t{font-size:14px}
.jtabs{display:flex;gap:6px;margin:0 0 10px}
.jtab{
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;padding:5px 12px;
  border:1px solid var(--line);border-radius:999px;background:var(--raised);color:var(--muted);
}
.jtab.on{color:var(--ember);border-color:#4a3a2c}

/* ── drawers: sheet, palette, saves. Bottom sheets, because thumbs. */
.scrim{position:fixed;inset:0;background:#000a;backdrop-filter:blur(2px);z-index:20}
.sheetpane{
  position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:82dvh;overflow-y:auto;
  background:var(--surface);border-top:1px solid var(--line);
  border-radius:14px 14px 0 0;padding:6px var(--pad) calc(env(safe-area-inset-bottom) + 18px);
  max-width:720px;margin:0 auto;
}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 14px}
.paneclose{
  position:absolute;top:8px;right:10px;width:32px;height:32px;border-radius:8px;
  border:1px solid var(--line);background:var(--raised);color:var(--muted);
  font-size:13px;display:grid;place-items:center;z-index:2;
}
.sheetpane h2{font-family:var(--serif);font-size:20px;margin:0 0 2px;font-weight:600}
.sheetpane h3{
  font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);
  margin:20px 0 8px;font-weight:600;
}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--raised)}
.stat .k{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.stat .v{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums;margin-top:1px}
.abils{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.ab{text-align:center;border:1px solid var(--line);border-radius:var(--r);padding:7px 2px;background:var(--raised)}
.ab .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.ab .m{font-family:var(--mono);font-size:16px;margin-top:1px}
.ab .s{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.list{display:flex;flex-direction:column;gap:1px}
.li{padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{font-size:14.5px}
.li .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.li .d.serif{font-family:var(--serif);font-size:14px;font-style:italic}
.act{
  width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--r);
  background:var(--raised);padding:10px 12px;margin-bottom:7px;
}
.act[disabled]{opacity:.42}
.act .t{font-size:14.5px}
.act .d{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:3px}
.savebtn{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--r);
  background:var(--raised);padding:12px 13px;margin-bottom:8px}
.savebtn .t{font-family:var(--serif);font-size:17px}
.savebtn .d{font-size:12px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.field{width:100%;background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;font-size:16px;margin-bottom:8px}
.note{font-size:12.5px;color:var(--faint);line-height:1.5}
.bar-hp{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar-hp i{display:block;height:100%;background:var(--moss)}
.bar-hp i.low{background:var(--blood)}
@media (prefers-reduced-motion:no-preference){
  .sheetpane{animation:rise .18s ease-out}
  @keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
}
</style>
</head>
<body>
<!-- The landing screen. A full cover rather than a sheet: opening the link should put
     you somewhere you chose to be, not back inside whatever panel was open last time. -->
<div id="home" hidden>
  <div class="homecard">
    <h1>Cinderhold</h1>
    <p class="tagline">The Meridian Syndicate did not fight the war. It supplied both sides,
      and when the empires bled out the supplier was the only thing left standing.</p>
    <div id="homeActions"></div>
    <p class="homefoot" id="homeFoot"></p>
  </div>
</div>

<div id="app">
  <aside class="side left">
    <div class="panel" id="panelActions"></div>
    <div class="panel" id="panelSheet"></div>
  </aside>

  <div id="center">
  <header>
    <div class="hrow">
      <div class="place" id="place">Cinderhold</div>
      <div class="when mono" id="when"></div>
      <button class="gear" id="toggleLeft" title="Panels" aria-label="Toggle side panels">◫</button>
      <button class="gear" id="toggleRight" title="Map" aria-label="Toggle map">🗺</button>
      <button class="gear" id="openSettings" title="Settings" aria-label="Settings">⚙</button>
    </div>
    <div class="hmeta" id="hmeta"></div>
    <div id="fight"></div>
  </header>

  <main id="feed"></main>

  <footer>
    <div class="working hide" id="working"></div>
    <div class="chips" id="chips"></div>
    <div class="tabs">
      <button class="tab" data-pane="palette"><span class="g">⚔</span>Actions</button>
      <button class="tab" data-pane="map"><span class="g">🗺</span>Map</button>
      <button class="tab" data-pane="journal"><span class="g">📖</span>Journal</button>
      <button class="tab" data-pane="log"><span class="g">🕰</span>Log</button>
      <button class="tab" data-pane="sheet"><span class="g">🛡</span>Sheet</button>
    </div>
    <div class="bar">
      <textarea id="say" rows="1" placeholder="What do you do?  (or ask: what can I do?)" enterkeyhint="send"></textarea>
      <button id="send" aria-label="Send">↑</button>
    </div>
  </footer>
  </div>

  <aside class="side right">
    <div class="panel" id="panelMap"></div>
  </aside>
</div>

<script>
"use strict";

// ─────────────────────────────────────────────────────────────── state
// The client holds view models and a version number. It never holds game state, so it
// can never disagree with the server about an outcome — same reason the narrator
// doesn't hold state either.
const S = {
  saveId: localStorage.getItem("dnd.save") || "",
  token: localStorage.getItem("dnd.token") || "",
  version: 0,
  screen: null,
  busy: false,
  /** The chip last tapped, and what it meant. Cleared on every submit. */
  chipText: "",
  chipAction: null,
  /** The table's agreement for this save: tone, dice, how lively the world is. */
  sessionZero: null,
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));

function headers(extra) {
  const h = Object.assign({ "content-type": "application/json" }, extra || {});
  if (S.token) h.authorization = "Bearer " + S.token;
  // Playing over an ngrok free tunnel, every request from a browser User-Agent is answered
  // with ngrok's own interstitial page instead of the API — so `res.json()` gets HTML and
  // the game looks unreachable for no visible reason. Clicking through the warning sets a
  // cookie that fixes the page load; this fixes the fetches regardless. Harmless anywhere
  // else: it is one unrecognised header.
  h["ngrok-skip-browser-warning"] = "1";
  return h;
}
async function api(path, opts) {
  const res = await fetch(path, Object.assign({ headers: headers() }, opts || {}));
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(body.error || res.status), { status: res.status, body });
  return body;
}

// ─────────────────────────────────────────────────────────────── the feed
const feed = $("feed");
let atBottom = true;
feed.addEventListener("scroll", () => {
  atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 60;
});
function stick() { if (atBottom) feed.scrollTop = feed.scrollHeight; }

function add(html) {
  const d = document.createElement("div");
  d.className = "entry";
  d.innerHTML = html;
  feed.appendChild(d);
  stick();
  return d;
}
function addSaid(text) { add('<div class="said">' + esc(text) + "</div>"); }
function addSys(text) { add('<div class="sys">' + esc(text) + "</div>"); }
function addErr(text) { add('<div class="err">' + esc(text) + "</div>"); }

// A roll card. Shows the natural die, then the itemised modifiers, then the target —
// the whole arithmetic, because a player who cannot check the maths cannot trust it.
function rollHtml(r) {
  const out = (r.outcome || "").toUpperCase();
  let cls = "";
  if (r.critical || r.fumble) cls = "crit";
  else if (/HIT|SUCCESS|CRITICAL/.test(out) && !/MISS|FAIL/.test(out)) cls = "good";
  else if (/MISS|FAIL/.test(out)) cls = "bad";

  const parts = (r.parts || []).map((p) =>
    (p.value >= 0 ? " + " : " − ") + '<span title="' + esc(p.label) + '">' + Math.abs(p.value) + "</span>"
  ).join("");
  const second = r.other != null ? ' <span class="dim">(' + r.other + " " + esc(r.advantage || "") + ")</span>" : "";
  const target = r.target != null ? ' <span class="dim">vs ' + r.target + "</span>" : "";

  return '<div class="roll ' + cls + '">'
    + '<div class="rtop"><span class="rpurpose">' + esc(r.purpose || "roll") + "</span>"
    + '<span class="routcome">' + esc(out) + "</span></div>"
    + '<div class="rmath"><span class="nat">' + r.natural + "</span>" + second + parts
    + ' <span class="dim">=</span> ' + r.total + target + "</div></div>";
}

// ─────────────────────────────────────────────────────────────── header
function paintHeader() {
  const sc = S.screen && S.screen.scene;
  if (!sc) return;
  $("place").textContent = sc.location.name;
  const t = sc.time || {};
  $("when").textContent = [t.label, t.hour != null ? String(t.hour).padStart(2, "0") + ":00" : "", "day " + (t.day ?? "?")]
    .filter(Boolean).join(" · ");

  const tags = [];
  const sh = S.screen.sheet;
  if (sh && sh.hp) {
    const low = sh.hp.current <= sh.hp.max / 3;
    tags.push('<span class="tag hp' + (low ? " hurt" : "") + '">' + sh.hp.current + "/" + sh.hp.max + " hp</span>");
  }
  for (const p of sc.present || []) {
    const hostile = p.disposition === "hostile" || p.disposition === "afraid";
    tags.push('<span class="tag person' + (hostile ? " hostile" : "") + '" title="' + esc(p.descriptor || "") + '">'
      + esc(p.name) + (p.down ? " ✝" : "") + "</span>");
  }
  for (const e of sc.exits || []) {
    tags.push('<span class="tag">' + esc(e.dir) + " → " + esc(e.name) + (e.locked ? " 🔒" : "") + "</span>");
  }
  if (t.weather) tags.push('<span class="tag">' + esc(t.weather) + "</span>");
  $("hmeta").innerHTML = tags.join("");
  paintFight();
  paintSides();
}

/**
 * The fight, if there is one.
 *
 * This is the single most important thing that was missing. In a fight the engine
 * correctly refuses to let you stroll to the bakehouse, and correctly reads "go over
 * there" as crossing a zone — but a client that never mentions the fight turns both of
 * those into the game apparently not understanding plain English. Enemy intent is free:
 * the CPU policy is deterministic, so the server already knows what each creature is
 * about to do, and showing it removes guesswork without removing difficulty.
 */
function paintFight() {
  const el = $("fight");
  const c = S.screen && S.screen.combat;
  if (!c) { el.innerHTML = ""; return; }

  const now = c.order.find((o) => o.is_current) || {};
  const mine = now.side === "party";
  const whose = now.name || "someone";
  const e = (S.screen.palette && S.screen.palette.economy) || null;

  const pip = (on, label) => (on ? "<b>" + label + "</b>" : "<s>" + label + "</s>");
  const pips = e
    ? [pip(e.action, "action"), pip(e.bonus, "bonus"), e.moves + " move" + (e.moves === 1 ? "" : "s"), pip(e.reaction, "reaction")].join(" · ")
    : "";

  const rows = c.order.map((o) => {
    const cls = [o.is_current ? "now" : "", o.side === "enemy" ? "enemy" : "", o.fled || o.hp.current <= 0 ? "gone" : ""].filter(Boolean).join(" ");
    const state = o.fled ? "fled" : o.hp.current <= 0 ? "down" : o.hp.current + "/" + o.hp.max;
    return '<div class="combatant ' + cls + '">'
      + '<span class="nm">' + esc(o.name) + "</span>"
      + '<span class="hpn">' + state + "</span>"
      + '<span class="it">' + esc(o.intent || (o.is_current ? "acting now" : "")) + "</span></div>";
  }).join("");

  // What the fight is FOR, when it is for anything but a body count. Without this on
  // screen an objective is a rule the player loses to without knowing it existed.
  const obj = c.objective
    ? '<div class="fobj">◎ ' + esc(c.objective) + "</div>"
    : "";

  // The ground the player is standing on, which is the other half of why one fight is
  // different from another.
  const myZone = (c.zones || []).find((z) => (z.occupants || []).some((n) => n === (S.screen.sheet && S.screen.sheet.name)));
  const ground = myZone && myZone.ground ? '<div class="fground">' + esc(myZone.name) + " — " + esc(myZone.ground) + "</div>" : "";

  el.innerHTML = '<div class="fight"><div class="fhead"><span>⚔ Round ' + c.round + " — "
    + (mine ? "your turn" : esc(whose) + " acts") + '</span><span class="pips">' + pips + "</span></div>"
    + obj + ground + rows + "</div>";
}

// Chips carry the action they were ranked from, so tapping one and sending it unedited
// does exactly what the chip advertised instead of being re-guessed from its wording.
let CHIP_ACTIONS = new Map();

function paintChips(list) {
  CHIP_ACTIONS = new Map();
  $("chips").innerHTML = (list || []).map((c, i) => {
    // Tolerate the old shape (plain strings) so a stale server cannot blank the bar.
    const text = typeof c === "string" ? c : c.text;
    if (typeof c !== "string" && c.action) CHIP_ACTIONS.set(text, c.action);
    // Say what it will cost BEFORE it is tapped. Players at a table ask "is this a
    // Persuasion check?" constantly; here the answer is knowable, so it is printed.
    const m = typeof c === "string" || !c.mechanic ? "" : '<span class="m">' + esc(c.mechanic) + "</span>";
    const title = typeof c === "string" || !c.detail ? "" : ' title="' + esc(c.detail) + '"';
    return '<button class="chip" data-say="' + esc(text) + '"' + title + " data-i=\"" + i + "\">"
      + m + esc(text) + "</button>";
  }).join("");
}
// Tapping a chip FILLS the box; it does not send. That is the whole reason chips exist —
// you read the phrasing, edit it, and learn what this game will understand. Submitting on
// tap turns them into buttons and teaches nothing.
$("chips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip");
  if (!b || S.busy) return;
  const say = $("say");
  // Remember what this chip meant. If it is sent unedited, that exact action is used; if
  // it is edited, the text goes through the parser like anything else. Both halves matter:
  // the chip teaches phrasing, and it still does what it said it would.
  S.chipText = b.dataset.say;
  S.chipAction = CHIP_ACTIONS.get(b.dataset.say) || null;
  say.value = b.dataset.say;
  say.focus();
  say.setSelectionRange(say.value.length, say.value.length);
  say.style.height = "auto";
  say.style.height = Math.min(120, say.scrollHeight) + "px";
});

// ─────────────────────────────────────────────────────────────── a turn
// One POST that answers with a stream of frames, in order: intent, mechanics, state,
// many prose deltas, done. The mechanics land before the narrator has written a word —
// that is the whole reason this is a stream and not a JSON response.
// Must stay in step with looksLikeRewind() in src/rules/rewindFind.ts. "Go back to the
// forge" is WALKING — offering to delete an afternoon because somebody wanted to visit
// the smith is the worst false positive this client could have.
const REWIND_PHRASE = /\b(rewind|roll ?back|undo|take me back|revert)\b|\bgo back to (before|just before|the (moment|point|turn)|when)\b/i;

async function submit(text, actionHint) {
  text = (text || "").trim();
  if (!text || S.busy) return;

  // Rewinding is not a turn — it is a thing you do TO the turns. Caught here so it never
  // reaches the intent parser, which would earnestly try to act it out in the fiction.
  // A chip sent back untouched carries its own action.
  if (!actionHint && S.chipAction && text === S.chipText) actionHint = S.chipAction;
  S.chipAction = null;
  S.chipText = "";

  if (!actionHint && REWIND_PHRASE.test(text)) {
    $("say").value = "";
    addSaid(text);
    return proposeRewind(text);
  }
  S.busy = true;
  setBusy("thinking");
  addSaid(text);
  $("say").value = "";
  $("say").style.height = "auto";
  paintChips([]);

  let res;
  try {
    res = await fetch("/api/saves/" + encodeURIComponent(S.saveId) + "/turn", {
      method: "POST",
      headers: headers(),
      body: JSON.stringify({
        save_id: S.saveId, text, expect_version: S.version,
        ...(actionHint ? { action_hint: actionHint } : {}),
      }),
    });
  } catch (err) {
    done(); addErr("Could not reach the server. " + err.message); return;
  }

  if (res.status === 409) {
    // Somebody else moved the world — another tab, a friend on another device. Re-read
    // it and say so, rather than applying a turn against a world that no longer exists.
    const b = await res.json().catch(() => ({}));
    done(); addSys(b.message || "The world moved. Reloading.");
    await load(S.saveId);
    return;
  }
  if (!res.ok) {
    const b = await res.json().catch(() => ({}));
    done(); addErr(b.error || ("Server said " + res.status)); return;
  }

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "";
  let proseEl = null;

  for (;;) {
    const { value, done: fin } = await reader.read();
    if (fin) break;
    buf += dec.decode(value, { stream: true });

    // SSE: records separated by a blank line, `data:` lines carry the JSON.
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const record = buf.slice(0, i);
      buf = buf.slice(i + 2);
      const line = record.split("\n").find((l) => l.startsWith("data:"));
      if (!line) continue;
      let f;
      try { f = JSON.parse(line.slice(5).trim()); } catch { continue; }
      proseEl = handleFrame(f, proseEl);
    }
  }
  done();
}

function handleFrame(f, proseEl) {
  switch (f.t) {
    case "intent":
      setBusy("resolving");
      break;

    case "mechanics": {
      S.version = f.version;
      const html = (f.rolls || []).map(rollHtml).join("")
        + (f.summary ? '<div class="summary">' + esc(f.summary) + "</div>" : "");
      if (html) add(html);
      setBusy("writing");
      break;
    }

    case "state":
      S.screen = f.screen;
      paintHeader();
      break;

    case "prose":
      if (!proseEl) proseEl = add('<div class="narr"></div>').querySelector(".narr");
      proseEl.textContent += f.delta;
      stick();
      break;

    // The narrator's first attempt died partway through and another is replacing it.
    // Wipe what was shown rather than letting two paragraphs run together.
    case "prose_reset":
      if (proseEl) proseEl.textContent = "";
      break;

    case "answer":
      add('<div class="narr">' + (f.lines || []).map(esc).join("\n") + "</div>");
      break;

    case "refused":
      addSys(f.reason);
      break;

    // The parser could not tell what was meant. Not a turn, not an error — a question,
    // and the answer to it is just the next thing you type.
    case "clarify":
      add('<div class="sys">' + esc(f.question) + "</div>");
      break;

    // Optimistic concurrency lost, mid-stream this time. The frame arrives instead of a
    // 409 when the other turn landed between the pre-check and the lock.
    case "conflict":
      addSys(f.message);
      S.version = f.actual_version;
      load(S.saveId);
      break;

    // The receipt for the turn. Rendered after the prose because that is what it is:
    // confirmation of what moved, not a headline.
    case "changed":
      if (f.changes && f.changes.length) add(changedHtml(f.changes));
      break;

    case "done":
      S.version = f.version;
      paintChips(f.suggestions);
      // A turn without prose still happened — the dice landed and the world moved. Say
      // so plainly rather than letting the silence read as a failure.
      if (f.note) addSys(f.note);
      if (f.rejects) addSys(f.rejects + " narrator proposal(s) rejected by the rules.");
      break;

    case "error":
      addErr(f.message + (f.retryable ? " (worth trying again)" : ""));
      break;
  }
  return proseEl;
}

// Each kind of change gets a mark and a weight. Facts and opened doors are the ones
// worth stopping on — a door nobody could have rolled their way through is the rarest
// thing this engine produces.
const CH = {
  fact:     { g: "•", cls: "big" },
  door:     { g: "⚿", cls: "big" },
  attitude: { g: "◆", cls: "" },
  clock:    { g: "◷", cls: "" },
  quest:    { g: "▸", cls: "big" },
  faction:  { g: "⚑", cls: "" },
  place:    { g: "⌖", cls: "" },
  person:   { g: "☗", cls: "big" },
  self:     { g: "✦", cls: "big" },
};

function changedHtml(changes) {
  const rows = changes.map((c) => {
    const spec = CH[c.t] || { g: "·", cls: "" };
    const cls = ["ch", spec.cls, c.sign === "up" ? "up" : c.sign === "down" ? "down" : ""].filter(Boolean).join(" ");
    return '<div class="' + cls + '"><span class="g">' + spec.g + "</span><span>" + changeText(c) + "</span></div>";
  }).join("");
  return '<div class="changed">' + rows + "</div>";
}

function changeText(c) {
  switch (c.t) {
    case "fact":     return "<b>" + esc(c.text) + "</b>";
    case "door":     return "<b>" + esc(c.who) + "</b> will talk about it now";
    case "attitude": return "<b>" + esc(c.who) + "</b> " + esc(c.note);
    case "clock":    return c.done
      ? "<b>" + esc(c.name) + "</b> — it lands"
      : esc(c.name) + " <b>" + c.filled + "/" + c.segments + "</b>";
    case "quest":    return "<b>" + esc(c.title) + "</b> — " + esc(c.note);
    case "faction":  return "<b>" + esc(c.name) + "</b> " + esc(c.note);
    case "place":    return "found <b>" + esc(c.name) + "</b>";
    case "person":   return "<b>" + esc(c.name) + "</b> " + esc(c.note);
    case "self":     return "<b>" + esc(c.note) + "</b>";
    default:         return esc(JSON.stringify(c));
  }
}

function setBusy(what) {
  const el = $("working");
  el.classList.remove("hide");
  el.innerHTML = { thinking: "the table is <b>listening</b>…", resolving: "rolling the <b>dice</b>…", writing: "the DM is <b>writing</b>…" }[what] || what;
  $("send").disabled = true;
  document.querySelectorAll(".tab").forEach((t) => { t.disabled = true; });
}
function done() {
  S.busy = false;
  $("working").classList.add("hide");
  $("send").disabled = false;
  document.querySelectorAll(".tab").forEach((t) => { t.disabled = false; });
}

// ─────────────────────────────────────────────────────────────── drawers
/** The furniture every bottom sheet has. One definition, so a rebuild cannot lose it. */
function sheetChrome(html) {
  return '<div class="grab"></div>'
    + '<button class="paneclose" data-close="1" aria-label="Close">✕</button>'
    + html;
}

function openPane(html) {
  closePane();
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  const pane = document.createElement("div");
  pane.className = "sheetpane";
  pane.style.position = "fixed";
  pane.innerHTML = sheetChrome(html);
  document.body.append(scrim, pane);
  scrim.addEventListener("click", closePane);
  // A map only knows where to centre once it has a size.
  if (pane.querySelector("#mapwrap")) requestAnimationFrame(mapCentre);
  return pane;
}
function closePane() {
  document.querySelectorAll(".scrim,.sheetpane").forEach((n) => n.remove());
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePane(); });

/**
 * Each view builds a string of HTML and nothing else. Where it is MOUNTED — a bottom
 * sheet on a phone, a fixed column on a desk — is decided elsewhere, so the two can never
 * drift apart and there is only one place to fix anything.
 *
 * Every interactive element inside is a `data-` attribute, handled by one delegated
 * listener on the document. That is what lets the same markup work in both places without
 * anybody re-attaching handlers.
 */
const VIEWS = {};
const PANES = {};

function openView(name) {
  const build = VIEWS[name];
  if (!build) return;
  const html = build();
  if (html && typeof html.then === "function") html.then((h) => h && openPane(h));
  else if (html) openPane(html);
}

for (const name of ["palette", "sheet", "map", "journal", "log"]) {
  PANES[name] = () => openView(name);
}

document.querySelector(".tabs").addEventListener("click", (e) => {
  const b = e.target.closest(".tab");
  if (!b || b.disabled) return;
  // On a desk the panel is already on screen; the tab focuses it rather than stacking a
  // sheet on top of a copy of itself.
  if (wide() && (b.dataset.pane === "map" || b.dataset.pane === "palette" || b.dataset.pane === "sheet")) {
    const el = document.getElementById(
      b.dataset.pane === "map" ? "panelMap" : b.dataset.pane === "palette" ? "panelActions" : "panelSheet");
    if (el && el.offsetParent !== null) { el.scrollIntoView({ block: "nearest" }); return; }
  }
  openView(b.dataset.pane);
});

const wide = () => window.matchMedia("(min-width:1100px)").matches;

// The character sheet. Everything the server already computed — this view never does
// arithmetic of its own, it just lays out what it was handed.
VIEWS.sheet = (() => {
  const s = S.screen;
  if (!s) return;
  const sh = s.sheet, xp = sh.xp || {};
  const pct = Math.round(100 * (sh.hp.current / Math.max(1, sh.hp.max)));

  let h = "<h2>" + esc(sh.name) + "</h2>"
    + '<div class="note">' + esc(sh.pronouns || "") + " · level " + sh.level
    + (xp.next ? " · " + xp.current + "/" + xp.next + " xp" : "") + "</div>"
    + '<div class="bar-hp"><i class="' + (pct <= 34 ? "low" : "") + '" style="width:' + pct + '%"></i></div>'
    + '<h3>Vitals</h3><div class="stats">'
    + stat("HP", sh.hp.current + " / " + sh.hp.max + (sh.hp.temp ? " +" + sh.hp.temp : ""))
    + stat("AC", sh.ac.total)
    + stat("Purse", fmtPurse(sh.purse))
    + (sh.inspiration ? stat("Inspiration", sh.inspiration.held + " / " + sh.inspiration.cap) : "")
    + "</div>"
    + '<h3>Abilities</h3><div class="abils">'
    + (sh.abilities || []).map((a) =>
        '<div class="ab"><div class="k">' + esc(a.key) + '</div><div class="m">'
        + (a.mod >= 0 ? "+" : "−") + Math.abs(a.mod) + '</div><div class="s">' + a.score + "</div></div>").join("")
    + "</div>";

  const prof = (sh.skills || []).filter((k) => k.proficient);
  if (prof.length) {
    h += "<h3>Proficient</h3><div class=\"note\">"
      + prof.map((k) => esc(k.key) + " " + (k.mod >= 0 ? "+" : "−") + Math.abs(k.mod)).join(" · ") + "</div>";
  }
  if ((sh.conditions || []).length) {
    h += "<h3>Conditions</h3><div class=\"note\">" + sh.conditions.map(esc).join(" · ") + "</div>";
  }
  if ((sh.slots || []).length) {
    h += "<h3>Spell slots</h3><div class=\"note\">"
      + sh.slots.map((s) => "lvl " + s.level + ": " + s.current + "/" + s.max).join(" · ") + "</div>";
  }
  if ((sh.inventory || []).length) {
    h += "<h3>Carried</h3><div class=\"list\">" + sh.inventory.map((it) =>
      '<div class="li"><div class="t">' + esc(it.name) + (it.qty > 1 ? " ×" + it.qty : "")
      + (it.equipped ? " <span class=\"tag\">worn</span>" : "") + "</div>"
      + (it.nickname ? '<div class="d serif">' + esc(it.nickname) + "</div>" : "") + "</div>").join("") + "</div>";
  }
  const active = (s.quests || []).filter((q) => q.status === "active");
  if (active.length) {
    h += "<h3>In hand</h3><div class=\"list\">" + active.map((q) =>
      '<div class="li"><div class="t">' + esc(q.title) + "</div>"
      + '<div class="d">' + esc(q.objective || q.summary || "") + "</div>"
      + (q.leads || []).map((l) => '<div class="d serif">“' + esc(l.text) + "”</div>").join("")
      + "</div>").join("") + "</div>";
  }
  if ((s.party || []).length) {
    h += "<h3>With you</h3><div class=\"list\">" + s.party.map((p) =>
      '<div class="li"><div class="t">' + esc(p.name) + "</div>"
      + '<div class="d">' + esc(p.descriptor || p.role || "") + "</div></div>").join("") + "</div>";
  }
  h += '<h3>This save</h3><div class="note">' + esc(S.saveId) + " · turn "
    + ((s.scene && s.scene.scene_id) || "?") + " · version " + S.version
    + "</div>";
  return h;
});

// Inspiration is a single point you either have or you do not.
function hasInspiration() {
  const sh = S.screen && S.screen.sheet;
  return !!sh && !!sh.inspiration && Number(sh.inspiration.held) > 0;
}

function stat(k, v) { return '<div class="stat"><div class="k">' + k + '</div><div class="v">' + esc(v) + "</div></div>"; }
function fmtPurse(p) {
  if (p == null) return "—";
  if (typeof p === "number") return p + " gp";
  return ["pp","gp","ep","sp","cp"].filter((c) => p[c]).map((c) => p[c] + c).join(" ") || "0";
}

// The action palette. Every entry is an Action the server itself offered, with the
// cost and the maths it will use — tapping one sends it as `action_hint`, so the
// intent parser is told rather than asked.
VIEWS.palette = (() => {
  const p = S.screen && S.screen.palette;
  if (!p) return;
  let h = "<h2>What you can do</h2>";
  for (const g of p.groups || []) {
    if (!g.items.length) continue;
    h += "<h3>" + esc(g.label) + "</h3>";
    for (const it of g.items) {
      h += '<button class="act" ' + (it.available ? "" : "disabled")
        + ' data-act="' + esc(JSON.stringify(it.action)) + '" data-label="' + esc(it.label) + '">'
        + '<div class="t">' + esc(it.label) + "</div>"
        + '<div class="d">' + esc([it.cost, it.detail, it.why_unavailable].filter(Boolean).join(" · ")) + "</div></button>";
      // Inspiration buys ADVANTAGE, and it has to be declared before the die is thrown —
      // which is the whole reason it needs its own button rather than a prompt afterwards.
      // `use_inspiration` has been on skill checks since phase 4; nothing ever offered it.
      if (it.available && it.action && it.action.type === "skill_check" && hasInspiration()) {
        const boosted = Object.assign({}, it.action, { use_inspiration: true });
        h += '<button class="act" style="margin:-3px 0 9px 16px;border-color:var(--brass)"'
          + ' data-act="' + esc(JSON.stringify(boosted)) + '" data-label="' + esc(it.label + ", spending Inspiration") + '">'
          + '<div class="t" style="color:var(--brass)">✦ …and spend Inspiration</div>'
          + '<div class="d">roll twice, keep the better</div></button>';
      }
    }
  }
  return h;
});

// ─────────────────────────────────────────────────────────────── map
// Not terrain — a text game's map answers "where can I go, and how long does it take".
// Coordinates come from `mapModel`; a node you have never visited shows as a rumour.
VIEWS.map = (() => mapHtml());

// ─────────────────────────────────────────────────────────────── map
/**
 * Not terrain. A text game's map answers three questions — where can I go, how long does
 * it take, and who is there — and it has to answer them at a scale you choose, because a
 * whole region squeezed into a phone screen answers none of them.
 *
 * So: a fixed viewport, an absolutely-positioned plane inside it, and one transform.
 * Dragging and zooming move the plane; nothing re-lays-out, so it stays smooth on a phone.
 */
const MAPV = { x: 0, y: 0, k: 1, ready: false, level: null, focus: undefined, pinnedTo: null };

/**
 * The plane every scale draws onto, in pixels.
 *
 * Positions are NORMALISED to this box rather than multiplied out of world coordinates.
 * Geography decides where things are relative to each other; it should not decide how
 * legible they are. A town spanning six coordinate units used to draw six times wider
 * than one spanning one, and then get shrunk to fit — same map, illegible for no reason.
 */
const MAP_CANVAS = 360;
const MAP_PAD = 36;

/** Place a set of marks on the canvas, keeping their shape. */
function mapPlacer(points) {
  const xs = points.map((p) => p.x), ys = points.map((p) => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  // Preserve the aspect: scale both axes by the SAME factor, or a town in a line becomes
  // a town in a square and the map stops meaning anything.
  const span = Math.max(x1 - x0, y1 - y0, 0.001);
  const k = MAP_CANVAS / span;
  return (p) => ({
    left: MAP_PAD + (p.x - x0) * k + (span - (x1 - x0)) * k / 2,
    top: MAP_PAD + (p.y - y0) * k + (span - (y1 - y0)) * k / 2,
  });
}

/**
 * Three scales, because they answer different questions.
 *
 *   world       where in the world — towns as single marks, and the open country between
 *   settlement  which building — the places inside one town
 *   place       which room, and who is in it — the zones of where you are standing
 *
 * Drawing all of them at once is what a flat grid of every location was doing, and it
 * answered none of them. The scale follows you by default and can be steered.
 */
function mapScope() {
  const m = S.screen && S.screen.map;
  if (!m) return { level: "world", focus: null };
  const mine = (m.settlements || []).find((st) => st.here);
  const auto = mine ? { level: "settlement", focus: mine.id } : { level: "world", focus: null };

  /**
   * A drill-down is a detour, not a destination.
   *
   * Looking at another town and then walking somewhere used to leave the map exactly
   * where you left it, so arriving at the riverbend showed you the world and you had to
   * go and find yourself on it. Moving is the strongest possible signal that what you
   * want to look at has changed, so a move drops whatever you were peering at and comes
   * back to you.
   */
  if (MAPV.pinnedTo && MAPV.pinnedTo !== (S.screen.scene && S.screen.scene.location.id)) {
    MAPV.level = null; MAPV.focus = undefined; MAPV.pinnedTo = null;
  }
  if (MAPV.level && MAPV.focus !== undefined) return { level: MAPV.level, focus: MAPV.focus };
  return auto;
}

function mapHtml() {
  const m = S.screen && S.screen.map;
  if (!m || !m.nodes.length) return '<h2>Map</h2><div class="note">Nowhere charted yet.</div>';

  const hereId = S.screen.scene && S.screen.scene.location.id;
  const scope = mapScope();
  const settlements = m.settlements || [];

  let marks = [];
  let crumb = "";
  let legend = "";

  if (scope.level === "place") {
    // Inside a building: the rooms, and who is in each.
    const node = m.nodes.find((n) => n.id === scope.focus) || m.nodes.find((n) => n.id === hereId);
    const zones = (node && node.zones) || [];
    crumb = '<button class="crumb" data-mapup="settlement">‹ ' + esc(node ? node.name : "back") + "</button>";
    if (!zones.length) {
      return "<h2>Map</h2>" + crumb
        + '<div class="note" style="margin-top:10px">Nothing inside worth drawing — one room, and you are in it.</div>';
    }
    marks = zones.map((z, i) => {
      const cols = Math.ceil(Math.sqrt(zones.length));
      const x = (i % cols) * 200 + MAP_PAD + 60;
      const y = Math.floor(i / cols) * 140 + MAP_PAD;
      const who = z.people || [];
      return '<div class="mnodewrap" style="left:' + x + "px;top:" + y + 'px">'
        + '<button class="mnode ' + (z.you ? "here" : "seen") + '" disabled title="'
        + esc(who.length ? z.name + " — " + who.join(", ") : z.name) + '">'
        + (z.you ? '<span class="youdot"></span>' : "") + esc(z.name)
        + ((z.terrain || []).length ? '<span class="mm">' + esc(z.terrain.join(", ")) + "</span>" : "")
        + "</button>"
        + (who.length ? '<span class="mppl" title="' + esc(who.join(", ")) + '">' + who.map(() => "●").join("") + "</span>" : "")
        + "</div>";
    });
    legend = "You are the green mark. Names under a room are what the ground does there.";

  } else if (scope.level === "settlement") {
    const st = settlements.find((x) => x.id === scope.focus);
    const inside = new Set(st ? st.location_ids : []);
    const nodes = m.nodes.filter((n) => inside.has(n.id));
    crumb = '<button class="crumb" data-mapup="world">‹ the world</button>'
      + (st ? '<span class="crumbnow">' + esc(st.name) + "</span>" : "");
    const place = mapPlacer(nodes.length ? nodes : [{ x: 0, y: 0 }]);
    marks = nodes.map((n) => markFor(n, hereId, place(n)));
    legend = "Buildings in " + esc(st ? st.name : "town") + ". Tap one to go there; tap where you stand to look inside.";

  } else {
    // The world: towns as one mark each, plus anything standing on its own.
    const grouped = new Set(settlements.flatMap((st) => st.location_ids));
    const loose = m.nodes.filter((n) => !grouped.has(n.id));
    const place = mapPlacer([...settlements, ...loose].length ? [...settlements, ...loose] : [{ x: 0, y: 0 }]);

    marks = settlements.map((st) => {
      const who = st.people || [];
      const at = place(st);
      return '<div class="mnodewrap" style="left:' + at.left.toFixed(0) + "px;top:" + at.top.toFixed(0) + 'px">'
        + '<button class="mnode town ' + (st.here ? "here" : "seen") + '" data-mapdown="' + esc(st.id) + '"'
        + ' title="' + esc(who.length ? st.name + " — " + who.join(", ") : st.name) + '">'
        + (st.here ? '<span class="youdot"></span>' : "") + esc(st.name)
        + '<span class="mm">' + st.location_ids.length + "</span></button>"
        + (who.length ? '<span class="mppl" title="' + esc(who.join(", ")) + '">' + who.slice(0, 6).map(() => "●").join("") + "</span>" : "")
        + "</div>";
    }).concat(loose.map((n) => markFor(n, hereId, place(n))));
    legend = "Towns and open country. Tap a town to go inside it.";
  }

  return "<h2>Map</h2>"
    + (crumb ? '<div class="crumbs">' + crumb + "</div>" : "")
    + '<div class="mapwrap" id="mapwrap">'
    + '<div class="mapplane" id="mapplane">' + marks.join("") + "</div>"
    + '<div class="maptools">'
    + '<button data-zoom="-1" aria-label="Zoom out">−</button>'
    + '<button data-zoom="1" aria-label="Zoom in">+</button>'
    + '<button data-zoom="0" aria-label="Centre on you">◎</button>'
    + "</div>"
    + '<div class="maphint">drag to pan · pinch or scroll to zoom</div>'
    + "</div>"
    + '<div class="mlegend">' + legend
    + " The green dot is you; dots are people you know are there. Bright is somewhere you have walked,"
    + " dimmer is found but not entered, faded italic is a name you have only heard."
    + " <b>★</b> a quest wants you, <b>•</b> a lead points.</div>";
}

function markFor(n, hereId, at) {
  const here = n.id === hereId;
  const cls = here ? "here" : n.state === "visited" ? "seen" : n.state === "seen" ? "found" : "unknown";
  const pin = (n.pins || []).includes("quest") ? "★ " : (n.pins || []).includes("lead") ? "• " : "";
  const go = !here && n.travel_minutes != null;
  const people = n.people || [];

  // Standing here with rooms inside? Tapping looks in rather than walking on the spot.
  const down = here && (n.zones || []).length > 1 ? ' data-mapinto="' + esc(n.id) + '"' : "";

  return '<div class="mnodewrap" style="left:' + at.left.toFixed(0) + "px;top:" + at.top.toFixed(0) + 'px">'
    + '<button class="mnode ' + cls + '"'
    + (go ? ' data-go="' + esc(n.id) + '" data-name="' + esc(n.name) + '"' : down ? down : " disabled")
    + ' title="' + esc(people.length ? n.name + " — " + people.join(", ") : n.name) + '">'
    + (here ? '<span class="youdot"></span>' : "") + pin + esc(n.name)
    + (n.travel_minutes != null && !here ? '<span class="mm">' + n.travel_minutes + "m</span>" : "")
    + (down ? '<span class="mm">look inside</span>' : "")
    + "</button>"
    + (people.length
        ? '<span class="mppl" title="' + esc(people.join(", ")) + '">'
          + people.slice(0, 6).map(() => "●").join("") + (people.length > 6 ? "+" : "") + "</span>"
        : "")
    + "</div>";
}

/** Redraw the map wherever it currently lives, and forget the old pan. */
function remountMap() {
  MAPV.x = 0; MAPV.y = 0; MAPV.k = 1;
  const panel = document.getElementById("panelMap");
  if (panel && panel.offsetParent !== null) { panel.innerHTML = mapHtml(); panel.dataset.stamp = "scale"; }
  const sheet = document.querySelector(".sheetpane");
  if (sheet && sheet.querySelector("#mapwrap")) sheet.innerHTML = sheetChrome(mapHtml());
  requestAnimationFrame(mapCentre);
}

/** Put the plane where the transform says, in one write. */
function mapApply() {
  const plane = document.getElementById("mapplane");
  if (!plane) return;
  plane.style.transform = "translate(" + MAPV.x + "px," + MAPV.y + "px) scale(" + MAPV.k + ")";
}

/**
 * Fit what is being shown, then centre it.
 *
 * This used to centre on the player at a fixed scale, which is fine on a wide screen and
 * useless in a 384px column: the rest of the town sat several hundred pixels outside the
 * viewport and the map looked like one lonely building. A map's first job is to show you
 * the shape of the thing, so it frames the marks it has and only then worries about zoom.
 */
function mapCentre() {
  const wrap = document.getElementById("mapwrap");
  const plane = document.getElementById("mapplane");
  if (!wrap || !plane) return;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  if (!w || !h) return;

  const marks = [...plane.querySelectorAll(".mnodewrap")];
  if (!marks.length) return;

  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const m of marks) {
    // Marks are centred on their point, so half the width sits either side.
    const cx = m.offsetLeft, cy = m.offsetTop;
    const hw = m.offsetWidth / 2, hh = m.offsetHeight / 2;
    x0 = Math.min(x0, cx - hw); x1 = Math.max(x1, cx + hw);
    y0 = Math.min(y0, cy - hh); y1 = Math.max(y1, cy + hh);
  }

  const pad = 26;
  const cw = Math.max(1, x1 - x0), ch = Math.max(1, y1 - y0);
  const fits = Math.min(1, (w - pad * 2) / cw, (h - pad * 2) / ch);

  /**
   * Readable first, complete second.
   *
   * Scaling to fit whatever is on the plane sounds right and reads terribly: a town with
   * places spread across it shrinks to forty per cent and every label becomes a smudge.
   * So the default is 1:1 on the player — everything near you is legible — and seeing the
   * whole town is one press of the zoom-out button away. Fitting only wins when the
   * content is already small enough to be read at that size.
   */
  const you = plane.querySelector(".mnode.here");
  if (fits >= 0.92 || !you) {
    MAPV.k = Math.max(0.35, fits);
    MAPV.x = w / 2 - ((x0 + x1) / 2) * MAPV.k;
    MAPV.y = h / 2 - ((y0 + y1) / 2) * MAPV.k;
  } else {
    MAPV.k = 1;
    const px = you.parentElement.offsetLeft;
    const py = you.parentElement.offsetTop;
    MAPV.x = w / 2 - px;
    MAPV.y = h / 2 - py;
  }
  mapApply();
}

function mapZoom(factor, cx, cy) {
  const next = Math.min(2.4, Math.max(0.35, MAPV.k * factor));
  if (next === MAPV.k) return;
  // Keep whatever is under the cursor or the pinch centre exactly where it is.
  MAPV.x = cx - (cx - MAPV.x) * (next / MAPV.k);
  MAPV.y = cy - (cy - MAPV.y) * (next / MAPV.k);
  MAPV.k = next;
  mapApply();
}

/**
 * Pointer events, once, on the document — so a map mounted in a drawer and a map mounted
 * in a column are the same map, and neither needs its handlers re-attached.
 */
function mapBindOnce() {
  if (MAPV.ready) return;
  MAPV.ready = true;
  let dragging = false, lastX = 0, lastY = 0, moved = 0;
  const pointers = new Map();
  let pinchDist = 0;

  const wrapOf = (e) => e.target.closest && e.target.closest(".mapwrap");

  document.addEventListener("pointerdown", (e) => {
    const wrap = wrapOf(e);
    if (!wrap) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      dragging = true; moved = 0;
      lastX = e.clientX; lastY = e.clientY;
      wrap.classList.add("dragging");
    } else if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
    }
  });

  document.addEventListener("pointermove", (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size === 2) {
      const wrap = document.querySelector(".mapwrap.dragging") || document.getElementById("mapwrap");
      if (!wrap) return;
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      if (pinchDist > 0) {
        const r = wrap.getBoundingClientRect();
        mapZoom(d / pinchDist, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
      }
      pinchDist = d;
      return;
    }
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    moved += Math.abs(dx) + Math.abs(dy);
    MAPV.x += dx; MAPV.y += dy;
    lastX = e.clientX; lastY = e.clientY;
    mapApply();
  });

  const release = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchDist = 0;
    if (pointers.size === 0) {
      dragging = false;
      document.querySelectorAll(".mapwrap.dragging").forEach((w) => w.classList.remove("dragging"));
      // A drag that ended on a node is a drag, not a tap. Without this, panning the map
      // by grabbing a town sends you walking to it.
      MAPV.suppressClick = moved > 6;
      setTimeout(() => { MAPV.suppressClick = false; }, 0);
    }
  };
  document.addEventListener("pointerup", release);
  document.addEventListener("pointercancel", release);

  document.addEventListener("wheel", (e) => {
    const wrap = wrapOf(e);
    if (!wrap) return;
    e.preventDefault();
    const r = wrap.getBoundingClientRect();
    mapZoom(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
}

// ─────────────────────────────────────────────────────────── journal
// What the game is about, in its own words: quests, the leads under them, who is with you,
// and — when you are mid-conversation — what you could ask and why a door is shut.
/** Which page of the Journal is showing. */
let JOURNAL_TAB = "quests";

VIEWS.journal = (() => {
  const s = S.screen;
  if (!s) return;
  const open = (s.quests || []).filter((q) => q.status === "active");
  const shut = (s.quests || []).filter((q) => q.status !== "active");

  let h = "<h2>Journal</h2>"
    + '<div class="jtabs">'
    + ["quests", "people", "pack"].map((t) =>
        '<button class="jtab' + (JOURNAL_TAB === t ? " on" : "") + '" data-jtab="' + t + '">' + t + "</button>").join("")
    + "</div>";

  if (JOURNAL_TAB === "people") return h + journalPeople(s);
  if (JOURNAL_TAB === "pack") return h + journalPack(s);

  // Threads first. A promise the player made themselves outranks an errand they were
  // handed, and it is the half of the story nobody authored.
  const threads = s.threads || [];
  const openThreads = threads.filter((t) => t.status === "open");
  const doneThreads = threads.filter((t) => t.status !== "open");
  if (openThreads.length) {
    h += "<h3>You said you would</h3>";
    for (const t of openThreads) {
      h += '<button class="lead' + (t.here ? " now" : "") + '" data-say="' + esc(t.text) + '">'
        + esc(t.text)
        + (t.from ? ' <span class="note">— ' + esc(t.from) + "</span>" : "")
        + (t.here ? ' <span class="note" style="color:var(--ember)">· they are here</span>' : "")
        + "</button>";
    }
  }
  if (doneThreads.length) {
    h += "<h3>Settled</h3><div class=\"list\">" + doneThreads.map((t) =>
      '<div class="li"><div class="t" style="opacity:.7">' + esc(t.text) + "</div>"
      + '<div class="d">' + esc(t.status) + (t.outcome ? " — " + esc(t.outcome) : "") + "</div></div>").join("") + "</div>";
  }

  if (!open.length) h += '<div class="note">Nothing pressing.</div>';
  for (const q of open) {
    h += "<h3>" + esc(q.title) + "</h3>";
    if (q.summary) h += '<div class="note" style="font-family:var(--serif);font-size:14.5px;line-height:1.5">' + esc(q.summary) + "</div>";
    if (q.objective) h += '<div class="note" style="margin-top:6px">→ ' + esc(q.objective) + "</div>";
    // A lead is a sentence you can act on. Tapping one puts it in the box so you can
    // edit it into what you actually mean — same contract as the chips.
    for (const l of q.leads || []) {
      h += '<button class="lead" data-say="' + esc(l.text) + '">' + esc(l.text)
        + (l.from ? ' <span class="note">— ' + esc(l.from) + "</span>" : "") + "</button>";
    }
  }

  const c = s.conversation;
  if (c && c.with && (c.topics || []).length) {
    h += "<h3>You could ask " + esc(c.with.name) + "</h3>";
    for (const t of c.topics) {
      const shutWhy = t.access && t.access.kind !== "open" ? t.access.why : null;
      h += '<button class="topicbtn" ' + (t.open ? 'data-say="' + esc(t.label) + '"' : "disabled") + ">"
        + '<div class="t">' + esc(t.label) + (t.asked ? " ✓" : "") + "</div>"
        // Say WHY it is closed. A greyed row with no reason teaches nothing; the reason
        // is usually the most interesting sentence on the screen.
        + (shutWhy ? '<div class="sealed">' + esc(shutWhy)
            + (t.access.opens_when ? " — opens when " + esc(t.access.opens_when) : "") + "</div>" : "")
        + "</button>";
    }
  }

  if ((s.party || []).length) {
    h += "<h3>With you</h3><div class=\"list\">" + s.party.map((m) =>
      '<div class="li"><div class="t">' + esc(m.name) + "</div>"
      + '<div class="d">' + esc(m.descriptor || m.role || "") + "</div></div>").join("") + "</div>";
  }
  if ((s.vows || []).length) {
    h += "<h3>Sworn</h3><div class=\"list\">" + s.vows.map((v) =>
      '<div class="li"><div class="t">' + esc(v.text || v.title || "") + "</div></div>").join("") + "</div>";
  }
  if (shut.length) {
    h += "<h3>Behind you</h3><div class=\"list\">" + shut.map((q) =>
      '<div class="li"><div class="t">' + esc(q.title) + '</div><div class="d">' + esc(q.status) + "</div></div>").join("") + "</div>";
  }

  return h;
});

/**
 * Who you have met, and what you know about them.
 *
 * The cast is the half of a campaign a player actually keeps in their head, and it was
 * nowhere in the interface — every name lived in scrollback. Only people you have met,
 * because this is your journal and not the DM's notes.
 */
/**
 * What you are carrying, where you would look for it.
 *
 * It was only ever on the character sheet, behind stats, which is not where anybody
 * looks for their bag — and "what did that person just hand me" is a question about the
 * story, not about your armour class.
 */
function journalPack(s) {
  const sh = s.sheet || {};
  const items = sh.inventory || [];
  let h = "";

  if (sh.purse != null) {
    h += '<div class="note">Purse: ' + esc(fmtPurse(sh.purse)) + "</div>";
  }
  if (!items.length) {
    return h + '<div class="note" style="margin-top:8px">Nothing but what you stand up in.</div>';
  }

  const worn = items.filter((i) => i.equipped);
  const carried = items.filter((i) => !i.equipped);

  const row = (i) =>
    '<div class="li"><div class="t">' + esc(i.name) + (i.qty > 1 ? " ×" + i.qty : "")
    + (i.importance === "quest" ? ' <span class="note" style="color:var(--brass)">· this matters</span>' : "")
    + "</div>"
    + (i.nickname ? '<div class="d serif">' + esc(i.nickname) + "</div>" : "")
    + "</div>";

  if (worn.length) h += "<h3>In hand or worn</h3><div class=\"list\">" + worn.map(row).join("") + "</div>";
  if (carried.length) h += "<h3>Carried</h3><div class=\"list\">" + carried.map(row).join("") + "</div>";
  return h;
}

function journalPeople(s) {
  const here = new Set((s.scene && s.scene.present ? s.scene.present : []).map((p) => p.id));
  const party = new Set((s.party || []).map((p) => p.id));
  const rows = (s.people || []).slice().sort((a, b) =>
    (here.has(b.id) ? 1 : 0) - (here.has(a.id) ? 1 : 0) || a.name.localeCompare(b.name));

  if (!rows.length) return '<div class="note">Nobody yet. The people you meet will collect here.</div>';

  return '<div class="list">' + rows.map((p) =>
    '<div class="li"><div class="t">' + esc(p.name)
    + (here.has(p.id) ? ' <span class="note" style="color:var(--ember)">· here</span>' : "")
    + (party.has(p.id) ? ' <span class="note" style="color:var(--moss)">· with you</span>' : "")
    + "</div>"
    + (p.descriptor ? '<div class="d serif">' + esc(p.descriptor) + "</div>" : "")
    + '<div class="d">' + esc(p.disposition || "") + (p.where ? " · last seen at " + esc(p.where) : "") + "</div>"
    + (p.opinion ? '<div class="d serif">“' + esc(p.opinion) + "”</div>" : "")
    + "</div>").join("") + "</div>";
}

// ─────────────────────────────────────────────────────────────── log
// Turn by turn, with the cascades underneath. The feed is the story; this is the record —
// what the engine did, including the triggers that fired because of what you did.
VIEWS.log = (async () => {
  let rows = [];
  try { rows = (await api("/api/saves/" + encodeURIComponent(S.saveId) + "/history")).rows || []; }
  catch (err) { return '<h2>Log</h2><div class="note">' + esc(err.message) + "</div>"; }

  if (!rows.length) return '<h2>Log</h2><div class="note">Nothing has happened yet.</div>';

  const latest = Math.max(...rows.map((r) => r.turn));
  const body = rows.slice().reverse().map((r) =>
    '<div class="turnrow"><div class="n">' + r.turn + "</div><div class=\"s\">"
    + esc(r.summary)
    + (r.children || []).map((c) => '<div class="c">↳ ' + esc(c.summary) + (c.trigger ? " (" + esc(c.trigger) + ")" : "") + "</div>").join("")
    + "</div>"
    // Rewinding to turn N keeps turn N. "Back to here" means undoing this one, which is
    // what anybody pointing at a row in a log means.
    + (r.turn > 0 ? '<button class="rb" data-rewind="' + (r.turn - 1) + '" data-what="' + esc(r.summary) + '">undo</button>' : "")
    + "</div>").join("");

  LATEST_TURN = latest;
  return "<h2>Log</h2>"
    + '<div class="note">' + rows.length + " turns, newest first. Indented lines are what the "
    + "world did in response — triggers firing, clocks landing, people reacting. "
    + "<b>undo</b> takes the world back to just before that turn.</div>"
    + '<div class="list" style="margin-top:12px">' + body + "</div>";
});

/** The newest turn number, remembered so a rewind can say what it costs. */
let LATEST_TURN = 0;

/**
 * Rewinding is the one thing in this game that takes turns away, so it is always
 * confirmed against a NAMED turn rather than a number, and it always says how much it
 * costs. Nothing is deleted — the dropped events are archived as a branch — but "nothing
 * is deleted" is not a reason to do it without asking.
 */
function confirmRewind(toTurn, what, latest) {
  const drops = Math.max(0, latest - toTurn);
  const pane = openPane("<h2>Go back?</h2>"
    + '<div class="warn">Back to <b>turn ' + toTurn + '</b> — just before “' + esc(what || "that") + '”.<br>'
    + "This sets aside <b>" + drops + "</b> turn" + (drops === 1 ? "" : "s") + ". "
    + "They are archived, not deleted, but the game will not remember them.</div>"
    + '<button class="act" id="rwGo" style="border-color:var(--blood)"><div class="t">Go back to turn ' + toTurn + "</div></button>"
    + '<button class="act" id="rwNo"><div class="t">Stay here</div></button>');

  pane.querySelector("#rwNo").addEventListener("click", closePane);
  pane.querySelector("#rwGo").addEventListener("click", async () => {
    pane.querySelector("#rwGo").disabled = true;
    try {
      await api("/api/saves/" + encodeURIComponent(S.saveId) + "/rewind", {
        method: "POST",
        body: JSON.stringify({ save_id: S.saveId, to_turn: toTurn, expect_version: S.version }),
      });
      closePane();
      await load(S.saveId);
      addSys("Gone back to turn " + toTurn + ".");
    } catch (err) {
      pane.querySelector("#rwGo").disabled = false;
      addErr(err.message);
      closePane();
    }
  });
}

// Typed rather than tapped: "take me back to before I attacked Jory". The server matches
// the description against the log and PROPOSES; it never rewinds on its own.
async function proposeRewind(text) {
  let plan;
  try {
    plan = await api("/api/saves/" + encodeURIComponent(S.saveId) + "/rewind/plan", {
      method: "POST", body: JSON.stringify({ text }),
    });
  } catch (err) { return void addErr(err.message); }

  if (!plan.candidates.length) {
    addSys("I could not find that in the log. Open the Log tab and undo from there.");
    return;
  }
  const pane = openPane("<h2>Go back to where?</h2>"
    + '<div class="note">Closest matches in the log, best first.</div>'
    + plan.candidates.map((c) =>
        '<button class="act" data-rewind="' + c.turn + '" data-what="' + esc(c.summary) + '">'
        + '<div class="t">turn ' + c.turn + " — just before “" + esc(c.summary) + "”</div>"
        + '<div class="d">sets aside ' + c.drops + " turn" + (c.drops === 1 ? "" : "s") + "</div></button>").join("")
    + '<button class="act" id="rwCancel"><div class="t">Never mind</div></button>');

  pane.querySelector("#rwCancel").addEventListener("click", closePane);
  pane.addEventListener("click", (e) => {
    const b = e.target.closest("[data-rewind]");
    if (b) confirmRewind(Number(b.dataset.rewind), b.dataset.what, plan.turn);
  });
}


/**
 * ONE listener for every panel, wherever it is mounted.
 *
 * Views build HTML and nothing else; every interactive thing in them is a `data-`
 * attribute handled here. That is what lets the same markup be a bottom sheet on a phone
 * and a fixed column on a desk without anybody re-attaching handlers, and it is why
 * adding a row to a panel never involves wiring.
 */
document.addEventListener("click", (e) => {
  const t = e.target;
  if (!t || !t.closest) return;

  // Travel, from the map.
  const go = t.closest("[data-go]");
  if (go && !go.disabled) {
    if (MAPV.suppressClick) return;      // that was a pan, not a tap
    closePane();
    submit("Travel to " + go.dataset.name, { type: "travel", location_id: go.dataset.go });
    return;
  }

  // Changing scale. The transform resets, because a view of a town and a view of the
  // world share no coordinates worth preserving.
  const pin = () => { MAPV.pinnedTo = S.screen && S.screen.scene ? S.screen.scene.location.id : null; };
  const down = t.closest("[data-mapdown]");
  if (down) { MAPV.level = "settlement"; MAPV.focus = down.dataset.mapdown; pin(); remountMap(); return; }
  const into = t.closest("[data-mapinto]");
  if (into) { MAPV.level = "place"; MAPV.focus = into.dataset.mapinto; pin(); remountMap(); return; }
  const up = t.closest("[data-mapup]");
  if (up) {
    if (up.dataset.mapup === "world") { MAPV.level = "world"; MAPV.focus = null; }
    else { MAPV.level = null; MAPV.focus = undefined; }
    remountMap();
    return;
  }

  const zoom = t.closest("[data-zoom]");
  if (zoom) {
    const wrap = zoom.closest(".mapwrap");
    const r = wrap.getBoundingClientRect();
    if (zoom.dataset.zoom === "0") {
      // Recentre means "show me where I am", which includes undoing a drill-down.
      MAPV.level = null; MAPV.focus = undefined;
      remountMap();
    }
    else mapZoom(zoom.dataset.zoom === "1" ? 1.25 : 1 / 1.25, r.width / 2, r.height / 2);
    return;
  }

  // An action from the palette, with the exact Action attached.
  const act = t.closest(".act[data-act]");
  if (act && !act.disabled) {
    closePane();
    submit(act.dataset.label, JSON.parse(act.dataset.act));
    return;
  }

  // A lead, a thread or a topic: fills the box rather than sending, same as a chip.
  const say = t.closest("[data-say]");
  if (say && !say.closest(".chips") && !say.disabled) {
    closePane();
    const box = $("say");
    box.value = say.dataset.say;
    box.focus();
    box.style.height = "auto";
    box.style.height = Math.min(120, box.scrollHeight) + "px";
    return;
  }

  const rw = t.closest("[data-rewind]");
  if (rw) { confirmRewind(Number(rw.dataset.rewind), rw.dataset.what, LATEST_TURN); return; }

  if (t.closest("[data-close]")) { closePane(); return; }

  const nav = t.closest("[data-nav]");
  if (nav) { closePane(); NAV[nav.dataset.nav] && NAV[nav.dataset.nav](); return; }
});

// ─────────────────────────────────────────────────── the desk layout
/**
 * On a wide screen the panels are not drawers, they are the room. Rebuilt on every state
 * change from the same builders the sheets use, so there is exactly one description of
 * what a panel contains.
 */
function paintSides() {
  if (!wide() || !S.screen) return;
  const into = (id, html) => {
    const el = document.getElementById(id);
    if (!el) return;
    // Keep the scroll position: a panel that jumps to the top every turn is unusable.
    const top = el.scrollTop;
    el.innerHTML = html || "";
    el.scrollTop = top;
  };
  if (!document.getElementById("app").classList.contains("no-left")) {
    into("panelActions", VIEWS.palette());
    into("panelSheet", VIEWS.sheet());
  }
  if (!document.getElementById("app").classList.contains("no-right")) {
    const el = document.getElementById("panelMap");
    // Only rebuild the map when the world actually moved, or panning is interrupted on
    // every frame of narration.
    const where = S.screen.scene ? S.screen.scene.location.id : "";
    const stamp = (S.screen.map && S.screen.map.nodes.length) + ":" + S.version + ":" + where;
    if (el && el.dataset.stamp !== stamp) {
      el.innerHTML = mapHtml();
      el.dataset.stamp = stamp;
      requestAnimationFrame(mapCentre);
    }
  }
}

function togglePanel(side) {
  const app = document.getElementById("app");
  const cls = side === "left" ? "no-left" : "no-right";
  app.classList.toggle(cls);
  try { localStorage.setItem("dnd." + cls, app.classList.contains(cls) ? "1" : "0"); } catch {}
  document.getElementById(side === "left" ? "toggleLeft" : "toggleRight")
    .classList.toggle("on", !app.classList.contains(cls));
  paintSides();
}

$("toggleLeft").addEventListener("click", () => togglePanel("left"));
$("toggleRight").addEventListener("click", () => togglePanel("right"));

// ─────────────────────────────────────────────────── settings and home
const NAV = {
  home: () => { closePane(); showHome(); },
  saves: () => pickSave(),
  settings: () => openSettings(),
  resetlayout: () => {
    const app = document.getElementById("app");
    app.classList.remove("no-left", "no-right");
    try {
      localStorage.removeItem("dnd.no-left");
      localStorage.removeItem("dnd.no-right");
    } catch {}
    $("toggleLeft").classList.add("on");
    $("toggleRight").classList.add("on");
    MAPV.level = null; MAPV.focus = undefined;
    MAPV.x = 0; MAPV.y = 0; MAPV.k = 1;
    const panel = document.getElementById("panelMap");
    if (panel) panel.dataset.stamp = "";
    closePane();
    paintSides();
    addSys("Layout reset.");
  },
  forget: () => {
    try { localStorage.removeItem("dnd.token"); } catch {}
    S.token = "";
    closePane();
    addSys("Secret forgotten on this device.");
  },
};
